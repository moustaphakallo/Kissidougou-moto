<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Boutique en Ligne</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
    header { background-color: #f68b1e; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    .card h3 { font-size: 16px; margin: 10px 0; color: #333; }
    .price { font-weight: bold; color: #f68b1e; font-size: 18px; margin-bottom: 10px; }
    button { background-color: #f68b1e; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #e07e1b; }
  </style>
</head>
<body>

  <header>Mon E-Commerce</header>

  <div class="grid" id="product-container"></div>

  <script>
    // Récupération des produits depuis le backend
    fetch('http://localhost:3000/api/products')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('product-container');
        data.forEach(product => {
          container.innerHTML += `
            <div class="card">
              <img src="${product.image}" alt="${product.name}">
              <h3>${product.name}</h3>
              <div class="price">${product.price.toLocaleString()} FCFA</div>
              <button>Acheter</button>
            </div>
          `;
        });
      })
      .catch(error => console.error('Erreur:', error));
  </script>

</body>
</html>
